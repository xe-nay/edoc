plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.edockit'
version = '1.0.0'

android {
  namespace "expo.modules.edockit"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // System document scanner (edge detection, cropping, filters), provided by Google Play services.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
  // Text recognition with the model bundled in the app, so it works with no connection.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
