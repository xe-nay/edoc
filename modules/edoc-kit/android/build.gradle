plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.edockit'
version = '1.0.0'

android {
  namespace "expo.modules.edockit"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // System document scanner (edge detection, cropping, filters), provided by Google Play services.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
  // Text recognition through Google Play services: the model is downloaded once by Play services
  // (the app itself has no internet access) instead of adding about 11 MB to the app.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
  implementation 'com.google.android.gms:play-services-base:18.11.1'
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
