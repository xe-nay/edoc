plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.edockit'
version = '1.0.0'

android {
  namespace "expo.modules.edockit"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

def cameraxVersion = '1.6.2'

dependencies {
  // eDoc's own scanner: the camera, and OpenCV for finding, straightening and cleaning up pages.
  implementation "androidx.camera:camera-camera2:$cameraxVersion"
  implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
  implementation "androidx.camera:camera-view:$cameraxVersion"
  implementation 'org.opencv:opencv:4.14.0'
  // Google's subject segmentation: finds the page in eDoc's own camera pictures. The model comes
  // through Google Play services, so it adds almost nothing to the app.
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
  // Google's document scanner, used only if eDoc's own scanner cannot start on a device.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
  // Text recognition through Google Play services: the model is downloaded once by Play services
  // (the app itself has no internet access) instead of adding about 11 MB to the app.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
  implementation 'com.google.android.gms:play-services-base:18.11.1'
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
