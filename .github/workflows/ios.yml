name: iOS build

# Builds an unsigned eDoc.ipa on a cloud Mac. The file is signed and installed
# on the iPhone with a free Apple ID. Only GitHub's own actions are used.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Every build gets its own version so the phone can tell that an update is available.
      - name: Set the version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));c.expo.version=process.argv[1];c.expo.ios.buildNumber=process.argv[2];fs.writeFileSync('app.json',JSON.stringify(c,null,2));" "$VERSION" "${{ github.run_number }}"

      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install pods
        run: cd ios && pod install

      - name: Build
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > xcodebuild.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|\*\* BUILD" xcodebuild.log | tail -80 || true
          exit $STATUS

      - name: Package the IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry eDoc.ipa Payload
          ls -lh eDoc.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: eDoc-ipa
          path: eDoc.ipa
          retention-days: 14

      # Stable links the iPhone downloads from: the installer and the app source read by SideStore.
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/make-source.mjs "${{ github.repository }}" "$VERSION" "$(stat -f%z eDoc.ipa)" > source.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eDoc.ipa source.json --title "eDoc $VERSION" --notes "Build $VERSION" --latest

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
